<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Flip</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2340;--soft:#6b6385;--bg:#fff3dc;--y:#ffd93b;--r:#ef4b4b;--g:#5cc85a;--b:#4aa3ff}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Press Start 2P",monospace;display:flex;flex-direction:column;align-items:center;padding:16px;user-select:none;-webkit-user-select:none;
    background-image:linear-gradient(rgba(43,35,64,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(43,35,64,.04) 2px,transparent 2px);background-size:24px 24px}
  header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  h1{font-size:18px;margin:0}
  h1 .a{color:var(--r)} h1 .b{color:var(--b)}
  .stars{font-size:14px;background:#fff;border:4px solid var(--ink);padding:8px 10px;box-shadow:4px 4px 0 var(--ink)}
  main{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .btn{font-family:inherit;font-size:14px;border:4px solid var(--ink);background:#fff;color:var(--ink);padding:14px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);line-height:1.4}
  .btn:active{transform:translate(4px,4px);box-shadow:none}
  .btn.big{font-size:18px;padding:18px 22px}
  .red{background:var(--r);color:#fff}.blue{background:var(--b);color:#fff}.green{background:var(--g);color:#fff}
  .btn.small{font-size:10px;padding:10px 10px}
  #start{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:30px}
  #start p{font-size:12px;line-height:1.8;color:var(--soft);max-width:360px;margin:0}
  .scene{width:min(86vw,360px);aspect-ratio:3/4;perspective:1200px}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s steps(10)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px}
  .front{background:#fff}
  .back{transform:rotateY(180deg)}
  .word{font-family:"Andika",sans-serif;font-weight:700;font-size:clamp(64px,22vw,110px);line-height:1;letter-spacing:3px}
  canvas.pix{width:82%;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--ink)}
  .label{font-family:"Andika",sans-serif;font-weight:700;font-size:44px}
  .card.wiggle .front{animation:wig .4s steps(6)}
  @keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .status{min-height:66px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .mic{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--soft)}
  .mic .dot{width:14px;height:14px;background:#ccc;border:3px solid var(--ink)}
  .mic.on .dot{background:var(--r);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  .heard{font-size:10px;color:var(--soft);min-height:14px;line-height:1.6}
  .msg{font-size:16px;color:var(--r)}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .note{font-size:10px;line-height:1.8;color:var(--soft);max-width:380px;text-align:center}
  .hidden{display:none!important}
  .px{position:fixed;width:12px;height:12px;pointer-events:none;z-index:9}
</style>
</head>
<body>
<header><h1><span class="a">WORD</span> <span class="b">FLIP</span></h1><div class="stars" id="stars">★ 0</div></header>
<main>
  <section id="start">
    <p>Read the word out loud to flip the card!</p>
    <button class="btn big red" data-level="easy">SHORT WORDS</button>
    <button class="btn big blue" data-level="hard">LONGER WORDS</button>
    <button class="btn big green" data-level="mix">MIX THEM UP</button>
  </section>
  <section id="game" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:20px;width:100%">
    <div class="scene"><div class="card" id="card"><div class="face front" id="front"></div><div class="face back" id="back"></div></div></div>
    <div class="status">
      <div class="mic" id="mic"><span class="dot"></span><span id="micText">MIC OFF</span></div>
      <div class="heard" id="heard"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="row" id="playRow">
      <button class="btn small" id="hearBtn">♪ HEAR IT</button>
      <button class="btn small" id="okBtn">✓ GROWN-UP: GOT IT</button>
      <button class="btn small" id="skipBtn">SKIP</button>
    </div>
    <div class="row hidden" id="nextRow"><button class="btn big green" id="nextBtn">NEXT ▶</button></div>
    <p class="note hidden" id="micNote">The mic isn't working in this browser. Open this file in Chrome or Safari, allow the microphone, and stay online. Until then, a grown-up can tap ✓.</p>
    <p class="note hidden" id="doneNote"></p>
  </section>
</main>

  bat:["........","........","........",".....k..",".....kvk","k...kvvv","kvk.kwkv","kvvkvpvv","kvvvvvvv","kvkvkvvv","k.k.kvvv",".....kkk"],

  nut:["........","......k.",".......k","....kkkk","..kNNNNN",".kNnNnNn",".kNNNNNN",".kkkkkkk","..knnnnn","..knwnnn","..knnnnn","...knnnn","....knnn",".....kkk"],

  map:["................","................","................","................","..kkkkkkkkkkkk..","..kttttttttttk..","..ktggttttbbtk..","..ktgggttbbbtk..","..kttgttttbttk..","..kttNttrtrttk..","..ktttNttrtttk..","..kttNttrtrttk..","..kkkkkkkkkkkk.."],
  jet:["................","................","................","................","................","................","..k.............","..kbk...........","..kbbkkkkkkkk...","..kbbbbbcbcbbkk.","..kkbbbbbbbbbbbk","....kkbbbbbbbkk.","......kbbbk.....",".......kkk......"],
  bee:["........","........","....k...",".kk..k..","kcck.kkk","kccckkkk",".kckyyyy","..kyykyy","..kkkkkk","..kyyyyy","..kkkkkk","...kyyyy","....kkkk"],
  owl:["........","........",".k......",".knkkkkk",".knnnnnn",".kwwwnnn",".kwkwnnn",".kwwwnny",".knnnnnn",".knttttt",".knttNtt",".knttttt","..knnnnn","...kkkkk","....o.o."],
  pie:["........","........","......s.",".....s..","......s.","........","..kkkkkk",".ktttttt",".kttNttN","kttttttt","ktNtNtNt","kbbbbbbb",".kbbbbbb","..kkkkkk"],
  key:["................","................","................","................","................","................","..kkkk..........",".kykkyk.........","kyk..kykkkkkkkk.","kyk..kyyyyyyyyyk","kyykkyykkkkyykyk",".kyyyyk....kk.k.","..kkkk.........."],
  top:["........","........",".......k",".......k",".....kkk","...kkrrr","..krrrrr",".kyyyyyy","krrrrrrr",".kbbbbbb","..krrrrr","...krrrr","....krrr","......kr",".......k"]
};

const HARD = {
  fish:["................","................","..b.............","b...............",".....kkk........","...kkoookk...kk.","..kooooooook.kok",".kowkoooooookook",".koooooooooookok","..koooooooookook","...kkoooookk.kok",".....kkkkk....kk"],
  frog:["........","........","........","..kkk...",".kwwwk..",".kwkwkkk",".kgggggg","kggggggg","kpgggggg","kgkggggg","kggkkkkk",".kgggggg","..kggggg",".kgkkkkk",".kk....."],
  cake:["........",".......o",".......y",".......p",".......p","..kkkkkk",".kwwwwww",".kpwwpww",".kpppwpp",".kpppppp",".kyyyyyy",".kpppppp",".kpppppp",".kkkkkkk","ssssssss"],
  star:["........",".......k","......ky","......ky",".....kyy","kkkkkyyy",".kyyyyyy","..kyykyy","...kyoyy","...kyyyk","..kyyyyy","..kyyykk",".kyykk..",".kkk...."],
  corn:["........","......kk",".....kyY",".....kYy",".....kyY",".....kYy",".....kyY","..k..kYy","..kk.kyY","..kgkkYy","..kggkyY","...kggky","....kggk",".....kgg","......kk"],
  duck:["................","................","................","........kkkk....",".......kyyyyk...",".......kyykyk...",".......kyyyyooo.",".......kyyyykkk.","..k....kyyyk....","..kkkkkyyyyyk...","..kyyyyyyyyyyk..","..kyykkkyyyyyk..","...kyyyyyyyyk...","....kkkkkkkk....","bbbbbbbbbbbbbbbb"],
  tree:["........",".....kkk","...kkggg","..kggggg",".kgggGgg",".kgggggg","kgGggggg","kggggrgg","kggggggg",".kgGgggg","..kkkknn",".....knn",".....knn","gggggknn"],
  moon:["................","................","....kkkk........","..kkyyyk...y....",".kyyyyk.........",".kyyyk..........","kyykyk..........","kyyyyk......y...","kyoyyk..........","kyyyyk..........",".kyyyk..........",".kyyyyk..w......","..kkyyyk........","....kkkk........"],
  bear:["........",".kkk....","knNnk...","knnkkkkk",".knnnnnn","knnnnnnn","knnknnnn","knnnnttt","kpnnttkk","knnnttkt",".knnnttt","..knnnnn","...kkkkk"],
  boat:["................",".......krr......",".......kr.......",".......kwk......",".......kwwk.....",".......kwwwk....",".......kwwwwk...",".......kwwwwwk..",".......kkkkkkkk.",".......k........","kkkkkkkkkkkkkkkk",".krrrrrrrrrrrrk.","..krrrrrrrrrrk..","...kkkkkkkkkk...","bbbbbbbbbbbbbbbb","bBbbbBbbbbBbbbBb"],
  ball:["........","........",".....kkk","...kkbry","..kwbbry",".kwbbbry",".kbbbbry","kbbbbbry","kbbbbbry",".kbbbbry",".kbbbbry","..kbbbry","...kkbry",".....kkk"],
  kite:["........",".......k","......kk",".....krk","....krrk","...krrrk","..krrrrk",".kkkkkkk","..kyyyyk","...kyyyk","....kyyk",".....kyk","......kk",".......k","......k.",".......k"],
  apple:["................",".......k........",".......kgg......","...kkkk.kkkk....","..krrrrkrrrrk...",".krwrrrrrrrrrk..",".krwrrrrrrrrrk..",".krrrrrrrrrrrk..",".krrrrrrrrrrrk..",".krrrrrrrrrrrk..","..krrrrrrrrrk...","..krrrrrrrrrk...","...krrrkrrrk....","....kkk.kkk....."],
  train:["................",".ss.............","..ss............","..kkkk...kkkkk..","...kk....kccck..","...kk....kccck..",".kkkkkkkkkkkkkk.",".krrrrrrrkrrrrk.","kyrrrrrrrkrrrrk.",".krrrrrrrkrrrrk.",".kkkkkkkkkkkkkk.","..kSk.kSk..kSSk.","..kkk.kkk..kkkk.","SSSSSSSSSSSSSSSS"],
  house:["........",".......k","......kr",".....krr","....krrr","...krrrr","..krrrrr",".kkkkkkk","..kttttt","..ktcctt","..ktcckk","..ktttkn","..ktttkn","..kkkkkk","gggggggg"],
  crab:["........","........","........","kk.kk...","krkrk.k.",".krk..k.","..k.kkkk","..kkrrrr","...krrrr","..krrrrr",".kkkrrrr",".k.kkkkk","k.k....."],
  drum:["........","n.......",".n......","..n.....","..kkkkkk",".kwwwwww",".kkkkkkk",".krrrrrr",".kyrrryr",".krryrry",".krrrrrr",".kkkkkkk"],
  sock:["................","................","....kkkkkk......","....kwwwwk......","....kkkkkk......","....kbbbbk......","....krrrrk......","....kbbbbk......","....krrrrk......","....kbbbbk......","....kbbbbbkk....","...kbbbbbbbrk...","...kwbbbbbbrrk..","....kkkkkkkkk..."],
  lamp:["........","........","....kkkk","....kyyy","...kyyyy","...kyyyy","..kyyyyy","..kkkkkk","......kn","......kn","......kn","....kkkk","...knnnn","...kkkkk"],
  bell:["........","......kk",".....kyy","....kyyy","...kyyyy","...kywyy","...kywyy","...kyyyy","..kyyyyy","..kyyyyy",".kyyyyyy",".kkkkkkk","......kY","......kk"],
  cloud:["........","........","........",".....kkk","..kkkwww",".kwwwwww",".kwwwwww","kwwwwkww","kwwpwwww","kwwwwwwk",".kwwwwww","..kkkkkk"],
  whale:["................","...........b.b..","............b...","............b...","......kkkkkk....","....kkbbbbbbkk..",".k.kbbbbbbbbbbk.","kbkbbbbbbbbkbbbk","kbbbbbbbbbbbbbbk",".kbbcccccccccbk.","..kbcccccccccbk.","...kkkkkkkkkkk.."],

};

const SOUNDS_LIKE = { sun:["son"], bee:["be","b"], pie:["pi"], key:["ki"], bear:["bare"], whale:["wail"], jet:["jett"], egg:["eg"] };

(() => {
  const $ = id => document.getElementById(id);
  const BGS = ["#ffe3ec","#dff3ff","#e6ffd9","#fff1c2","#efe4ff","#ffe6d1"];
  const st = { deck: [], idx: -1, cur: null, stars: 0, flipped: false, misses: 0 };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rowsOf = s => s.map(r => r.length === 8 ? r + [...r].reverse().join("") : r);

  function drawSprite(word, bg) {
    const c = document.createElement("canvas"); c.width = c.height = 16; c.className = "pix";
    const x = c.getContext("2d"); x.fillStyle = bg; x.fillRect(0, 0, 16, 16);
    const all = { ...EASY, ...HARD }, R = rowsOf(all[word]);
    const off = Math.floor((16 - R.length) / 2) + (R.length < 16 ? 0 : 0);
    R.forEach((row, y) => [...row].forEach((ch, i) => { if (PALETTE[ch]) { x.fillStyle = PALETTE[ch]; x.fillRect(i, y + Math.max(0, off - 1), 1, 1); } }));
    return c;
  }

  function startGame(level) {
    const words = level === "easy" ? Object.keys(EASY) : level === "hard" ? Object.keys(HARD) : [...Object.keys(EASY), ...Object.keys(HARD)];
    st.deck = shuffle(words); st.idx = -1;
    $("start").classList.add("hidden"); $("game").classList.remove("hidden"); $("doneNote").classList.add("hidden");
    next();
  }

  function next() {
    st.idx++;
    $("card").classList.remove("flipped");
    if (st.idx >= st.deck.length) {
      stopListening();
      $("front").innerHTML = `<div class="word" style="font-size:56px">★★★</div><div class="label" style="font-size:28px">All done!</div>`;
      $("playRow").classList.add("hidden"); $("nextRow").classList.add("hidden");
      $("doneNote").innerHTML = `<button class="btn big red" id="againBtn">PLAY AGAIN</button>`; $("doneNote").classList.remove("hidden");
      $("againBtn").onclick = () => { $("game").classList.add("hidden"); $("start").classList.remove("hidden"); };
      return;
    }
    const w = st.deck[st.idx]; st.cur = w; st.flipped = false; st.misses = 0;
    setTimeout(() => {
      $("front").innerHTML = `<div class="word">${w}</div>`;
      const back = $("back"); back.innerHTML = "";
      back.appendChild(drawSprite(w, BGS[st.idx % BGS.length]));
      const l = document.createElement("div"); l.className = "label"; l.textContent = w; back.appendChild(l);
    }, st.idx ? 350 : 0);
    $("msg").textContent = ""; $("heard").textContent = "";
    $("playRow").classList.remove("hidden"); $("nextRow").classList.add("hidden");
    startListening();
  }

  function success() {
    if (st.flipped || !st.cur) return;
    st.flipped = true; stopListening();
    $("card").classList.add("flipped");
    st.stars++; $("stars").textContent = "★ " + st.stars;
    const cheers = ["YOU DID IT!", "SUPER!", "WOW!", "GREAT JOB!", "YAY!", "AMAZING!"];
    $("msg").textContent = cheers[Math.floor(Math.random() * cheers.length)];
    $("heard").textContent = "";
    $("playRow").classList.add("hidden"); $("nextRow").classList.remove("hidden");
    fanfare(); burst();
    setTimeout(() => say(st.cur + "!"), 900);
  }

  function miss() {
    st.misses++;
    const c = $("card"); c.classList.remove("wiggle"); void c.offsetWidth; c.classList.add("wiggle");
    bloop();
    $("msg").textContent = st.misses >= 3 ? "TAP ♪ FOR A HINT" : "TRY AGAIN!";
  }

  // ---- speech recognition ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, want = false, dead = !SR, restarts = 0, last = "";
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();
  function matches(text) {
    const words = norm(text).split(" "), t = [st.cur, ...(SOUNDS_LIKE[st.cur] || [])];
    return t.some(w => words.includes(w) || words.includes(w + "s") || words.join("") === w);
  }
  const setMic = (on, txt) => { $("mic").classList.toggle("on", on); $("micText").textContent = txt; };
  function noMic() {
    dead = true; want = false; setMic(false, "MIC NOT AVAILABLE");
    $("micNote").classList.remove("hidden");
    $("okBtn").textContent = "✓ THEY READ IT!"; $("okBtn").className = "btn small green";
  }
  function startListening() {
    if (dead) { noMic(); return; }
    want = true; restarts = 0; last = "";
    if (!rec) {
      try { rec = new SR(); } catch { noMic(); return; }
      rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 5;
      rec.onstart = () => setMic(true, "LISTENING...");
      rec.onresult = ev => {
        if (st.flipped) return;
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          for (let j = 0; j < r.length; j++) if (matches(r[j].transcript)) { success(); return; }
          const h = norm(r[0].transcript);
          if (h) $("heard").textContent = "I HEARD: " + h.toUpperCase();
          if (r.isFinal && h && h !== last) { last = h; miss(); }
        }
      };
      rec.onerror = ev => { if (["not-allowed", "service-not-allowed", "audio-capture"].includes(ev.error)) noMic(); };
      rec.onend = () => {
        if (!dead) setMic(false, "MIC PAUSED");
        if (want && !dead && !st.flipped && restarts++ < 40) setTimeout(() => { try { rec.start(); } catch {} }, 250);
      };
    }
    try { rec.start(); } catch {}
  }
  function stopListening() { want = false; if (rec) try { rec.stop(); } catch {} }

  // ---- 8-bit sounds ----
  let ac = null;
  const ctx = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch {} return ac; };
  function note(f, t0, d, type = "square", v = .12) {
    const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.setValueAtTime(v, t + d * .8); g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
  }
  function fanfare() {
    [[523, 0], [659, .09], [784, .18], [1047, .27], [784, .4], [1047, .49]].forEach(([f, t]) => note(f, t, t >= .49 ? .35 : .09));
    [[1568, .7], [2093, .76], [2637, .82]].forEach(([f, t]) => note(f, t, .06, "square", .06));
  }
  function bloop() { note(392, 0, .1); note(262, .1, .18); }
  function say(t) { try { const u = new SpeechSynthesisUtterance(t); u.rate = .85; u.pitch = 1.15; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {} }

  function burst() {
    const cols = ["#ffd93b", "#ef4b4b", "#5cc85a", "#4aa3ff", "#a57cff", "#ff9ec4"];
    const cx = innerWidth / 2, cy = innerHeight * .4;
    for (let i = 0; i < 36; i++) {
      const d = document.createElement("div"); d.className = "px"; d.style.background = cols[i % cols.length];
      d.style.left = cx + "px"; d.style.top = cy + "px"; document.body.appendChild(d);
      const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 200;
      d.animate([{ transform: "translate(0,0)" }, { transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist + 200}px)`, opacity: 0 }],
        { duration: 1200 + Math.random() * 600, easing: "steps(12)" }).onfinish = () => d.remove();
    }
  }

  document.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { ctx(); startGame(b.dataset.level); });
  $("hearBtn").onclick = () => { if (!st.cur) return; const was = want; if (was) stopListening(); say(st.cur); if (was) setTimeout(startListening, 1400); };
  $("okBtn").onclick = () => { ctx(); success(); };
  $("skipBtn").onclick = () => { stopListening(); next(); };
  $("nextBtn").onclick = () => { ctx(); next(); };
})();
</script>
</body></html>
